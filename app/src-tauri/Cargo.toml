[package]
name = "bhcapture-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "BHCapture desktop shell."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bhcapture-core = { path = "../../crates/bhcapture-core" }
bhcapture-capture = { path = "../../crates/bhcapture-capture" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
global-hotkey = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
arboard = "3.4"
libc = "0.2"
tauri-plugin-dialog = "2"
base64 = "0.22"

[features]
# Test harness only (--demo, --demo-snap, --settings). Off in shipped builds: it drives the real
# command paths with synthetic input and writes into the user's Pictures folder.
demo = []
