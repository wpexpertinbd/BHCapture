[package]
name = "bhcapture-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Portable core for BHCapture: coordinate math, image ops, naming, settings."

# Pure portable Rust. NO Tauri, NO UI, NO platform discovery -- the shell injects every path.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust encoders, so every platform writes identical files. No default features: only the
# formats offered, which keeps the build and the binary small.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
nnnoiseless = { version = "0.5.2", default-features = false }
gif = "0.14"

[dev-dependencies]
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
serde_json = "1"
