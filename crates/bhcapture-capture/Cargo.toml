[package]
name = "bhcapture-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "One capture trait, with per-OS backends behind cfg()."

[dependencies]
bhcapture-core = { path = "../bhcapture-core" }

[dev-dependencies]
png = "0.17"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
# Same major as Tauri's own (0.62), so the build carries one copy.
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_MediaFoundation",
  "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation",
] }
