[package]
name = "bhcapture-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "One capture trait, with per-OS backends behind cfg()."

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
bhcapture-core = { path = "../bhcapture-core" }

[dev-dependencies]
png = "0.17"

# Unconditional: build.rs must COMPILE on every OS even though it only uses cc when building for
# macOS (CI on Linux/Windows failed with "cannot find crate cc").
[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
# Same major as Tauri's own (0.62), so the build carries one copy.
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_MediaFoundation",
  "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Registry",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure Rust X11 client (no libX11 needed); already in the tree through the clipboard/hotkey crates.
x11rb = { version = "0.13", features = ["randr", "xfixes"] }
# Linux has no system video encoder that is always present: OpenH264 is compiled in (~1 MB).
openh264 = "0.9.8"
# Opus via the system libopus (installed on every desktop distro: PipeWire/PulseAudio depend on it).
opus = "0.4"
# PulseAudio API for system sound (monitor source) and the microphone; PipeWire serves it too.
libpulse-binding = { version = "2.29", default-features = false }
libpulse-simple-binding = { version = "2.29", default-features = false }
# Webcams (Video4Linux2). Its bindings are generated at build time, so CI needs libclang.
v4l = "0.14"
# MJPEG webcam frames: the JPEG decoder screenshots already build in (no new codec).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Keep the desktop awake while recording (org.freedesktop.ScreenSaver); already in the tree.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
