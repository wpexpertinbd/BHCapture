name: Release

# A vX.Y.Z tag builds the Windows and Linux installers and attaches them to a DRAFT release.
# macOS is built and signed on the development Mac (scripts/release-macos.sh) and uploaded to the same
# draft: the signing key never leaves that Mac, and every update keeps users' Screen Recording grant.
# The draft is published by hand once every platform's files are on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # NSIS -setup.exe only, never .msi (decision 31).
          - os: windows-latest
            name: Windows (x64)
            target: ""
            args: --bundles nsis
          # Windows on ARM (Snapdragon, Parallels/VMware on Apple silicon), cross-built on x64.
          - os: windows-latest
            name: Windows (ARM64)
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          - os: ubuntu-22.04
            name: Linux (x86_64)
            target: ""
            args: --bundles deb,rpm
          - os: ubuntu-24.04-arm
            name: Linux (arm64)
            target: ""
            args: --bundles deb,rpm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential libxdo-dev libssl-dev libopus-dev libpulse-dev rpm
      - run: npm ci
        working-directory: app
      - name: Build
        working-directory: app
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Attach installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find . -type f \
            \( -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' \) \
            -not -path './app/node_modules/*' | sort)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no installers were produced"; exit 1; fi
          printf 'found:\n'; printf '  %s\n' "${files[@]}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "BHCapture for macOS, Windows & Linux $TAG" \
              --notes "Release notes are added before publishing." || true
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
